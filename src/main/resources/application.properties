spring.application.name=agromarket-backend

# An optional local .env file is loaded as a Java properties file. In deployed
# environments these values should be supplied by the platform instead.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=${JWT_ISSUER:agromarket-api}
app.security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

springdoc.swagger-ui.path=/swagger-ui.html

# Reproducible local/demo dataset. Never enable this in production.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}
